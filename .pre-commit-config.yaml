repos:
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-builtin-literals
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-ast
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier --write
        language: node
        additional_dependencies:
          - prettier@3.9.6
        files: ^src-frontend/.*\.(js|ts|vue|scss|html|md|json)$
        exclude: ^src-frontend/src-capacitor/
      - id: frontend-eslint
        name: frontend-eslint
        entry: ./src-frontend/node_modules/.bin/eslint --no-cache --ext .js,.ts,.vue
        language: system
        files: ^src-frontend/.*\.(js|ts|vue)$
        exclude: ^src-frontend/src-capacitor/
