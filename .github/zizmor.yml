# zizmor configuration
# https://docs.zizmor.sh/configuration/

rules:
  dangerous-triggers:
    ignore:
      # workflow_run is deliberately used here to promote the untrusted PR image
      # built by build_docker.pr.yml into GHCR with elevated permissions and to
      # comment on the PR. All fork-supplied inputs (image name, PR number) are
      # routed through env: and validated in the workflow itself.
      - upload_docker.pr.yml

  excessive-permissions:
    ignore:
      # Intentionally declares none, so the build job inherits the caller's
      # grant; callers can only narrow it, never widen it to repo defaults.
      - _build-docker.yml
