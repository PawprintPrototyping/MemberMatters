name: Build Docker Image (On PR)

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    branches:
      - "dev"

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: pawprintprototyping/membermatters

jobs:
  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      branch: ${{ steps.extract_branch.outputs.branch }}
      repoowner: ${{ steps.extract_repo_owner.outputs.repoowner }}
      imagename: ${{ steps.extract_image_name.outputs.imagename }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Extract branch name
        id: extract_branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          REF: ${{ github.ref }}
        shell: bash
        run: |
          raw="${HEAD_REF:-${REF#refs/heads/}}"
          echo "branch=${raw//\//-}" >> "$GITHUB_OUTPUT"

      - name: Extract repo owner
        id: extract_repo_owner
        env:
          HEAD_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
        shell: bash
        run: |
          echo "repoowner=${HEAD_OWNER//\//-}" >> "$GITHUB_OUTPUT"

      - name: Generate image name
        id: extract_image_name
        env:
          OWNER: ${{ steps.extract_repo_owner.outputs.repoowner }}
          BRANCH: ${{ steps.extract_branch.outputs.branch }}
        shell: bash
        run: |
          echo "imagename=${REGISTRY}/${IMAGE_NAME}:untrusted-pr-image-${OWNER}-${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Save PR number and branch/image name
        env:
          PR_NUMBER: ${{ github.event.number }}
          BRANCH: ${{ steps.extract_branch.outputs.branch }}
          PR_IMAGE_NAME: ${{ steps.extract_image_name.outputs.imagename }}
        shell: bash
        run: |
          mkdir -p ./pr
          printf '%s' "$PR_NUMBER" > ./pr/prnumber
          printf '%s' "$BRANCH" > ./pr/branchname
          printf '%s' "$PR_IMAGE_NAME" > ./pr/imagename

      - name: Build pr image
        id: docker_build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          tags: ${{ steps.extract_image_name.outputs.imagename }}
          outputs: type=docker,dest=./pr/untrusted-pr-image.tar
          file: docker/Dockerfile
          platforms: linux/amd64

      - name: Upload pr image as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr
          path: ./pr/
