name: Build Docker Image (On PR)

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    branches:
      - "dev"

permissions: {}

# One build per PR: without this, rapid pushes race to tag the same
# untrusted-pr-image-* name and the slowest run can win.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: pawprintprototyping/membermatters

jobs:
  # Compute the PR-specific tag and metadata so we can feed them into the
  # shared reusable build workflow. Kept separate from the build itself so
  # the reusable workflow doesn't need to know about pull_request-specific
  # context (head_ref, event.number, fork owner).
  prepare:
    name: Prepare PR image metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      imagename: ${{ steps.imagename.outputs.imagename }}
      metadata: ${{ steps.metadata.outputs.metadata }}
      commit-sha: ${{ steps.sha.outputs.full }}
    steps:
      - name: Extract branch name
        id: branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          REF: ${{ github.ref }}
        shell: bash
        run: |
          raw="${HEAD_REF:-${REF#refs/heads/}}"
          echo "branch=${raw//\//-}" >> "$GITHUB_OUTPUT"

      - name: Extract repo owner
        id: owner
        env:
          HEAD_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
        shell: bash
        run: |
          echo "repoowner=${HEAD_OWNER//\//-}" >> "$GITHUB_OUTPUT"

      - name: Generate image name
        id: imagename
        env:
          OWNER: ${{ steps.owner.outputs.repoowner }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        shell: bash
        run: |
          echo "imagename=${REGISTRY}/${IMAGE_NAME}:untrusted-pr-image-${OWNER}-${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Resolve commit SHA
        id: sha
        env:
          # For pull_request events, github.sha points at the merge commit
          # GitHub synthesises. The PR head SHA is what a reviewer would
          # actually check out, so prefer it when available.
          FULL_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: echo "full=${FULL_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build artifact metadata JSON
        id: metadata
        env:
          PR_NUMBER: ${{ github.event.number }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          IMG: ${{ steps.imagename.outputs.imagename }}
        shell: bash
        run: |
          metadata=$(jq -cn \
            --arg pr "$PR_NUMBER" \
            --arg branch "$BRANCH" \
            --arg image "$IMG" \
            '{prnumber: $pr, branchname: $branch, imagename: $image}')
          echo "metadata=$metadata" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/_build-docker.yml
    # Read-only: upload_docker.pr.yml does the push, via workflow_run.
    permissions:
      contents: read
    with:
      platforms: linux/amd64
      push: false
      tags: ${{ needs.prepare.outputs.imagename }}
      commit-sha: ${{ needs.prepare.outputs.commit-sha }}
      artifact-name: pr
      artifact-metadata: ${{ needs.prepare.outputs.metadata }}
