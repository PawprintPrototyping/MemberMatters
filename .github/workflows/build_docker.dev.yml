name: Build Docker Image (On Dev Push)

on:
  workflow_dispatch:
  push:
    branches:
      - "dev"

permissions: {}

jobs:
  build:
    uses: ./.github/workflows/_build-docker.yml
    permissions:
      contents: read
      packages: write # pushes the built image to GHCR
    with:
      platforms: linux/amd64
      push: true
      tags: ghcr.io/pawprintprototyping/membermatters:dev,ghcr.io/pawprintprototyping/membermatters:${{ github.sha }}
