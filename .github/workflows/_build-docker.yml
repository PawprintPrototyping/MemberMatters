# Reusable workflow that builds (and optionally pushes) the MemberMatters
# Docker image. All event-specific docker build workflows should call this
# via `uses:` rather than repeating the buildx/login/build-push steps.
#
# No `permissions:` here: a called workflow can only narrow the caller's token,
# never widen it, so the build job inherits the calling job's grant instead.
# Callers declare `contents: read`, plus `packages: write` when push is true.
name: Reusable Docker Build

on:
  workflow_call:
    inputs:
      platforms:
        description: "Comma-separated docker platforms (e.g. linux/amd64,linux/arm64)"
        type: string
        default: linux/amd64
      push:
        description: "Push the built image to the container registry"
        type: boolean
        default: false
      tags:
        description: "Comma-separated image tags to build"
        type: string
        required: true
      commit-sha:
        description: "Full commit SHA to embed as SENTRY_RELEASE. Defaults to github.sha."
        type: string
        default: ""
      artifact-name:
        description: "If set, save the image tarball plus metadata as an artifact with this name"
        type: string
        default: ""
      artifact-metadata:
        description: "JSON object of {filename: content} to write alongside the image tarball in the artifact"
        type: string
        default: "{}"
      upload-sourcemaps:
        description: "Build the frontend and upload its source maps to GlitchTip for the resolved commit SHA."
        type: boolean
        default: false
      glitchtip-org:
        description: "GlitchTip organisation slug (required when upload-sourcemaps is true)."
        type: string
        default: ""
      glitchtip-project:
        description: "GlitchTip project slug (required when upload-sourcemaps is true)."
        type: string
        default: ""
    secrets:
      GLITCHTIP_URL:
        description: "Base URL of the GlitchTip instance. Required when upload-sourcemaps is true."
        required: false
      GLITCHTIP_AUTH_TOKEN:
        description: "GlitchTip API auth token. Required when upload-sourcemaps is true."
        required: false

env:
  REGISTRY: ghcr.io
  NODE_VERSION: "24.20.0"

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - name: Reject unsupported input combination
        if: ${{ inputs.push && inputs.artifact-name != '' }}
        shell: bash
        run: |
          echo "push: true and artifact-name are mutually exclusive - only the" >&2
          echo "artifact build writes image.tar, so the upload would be empty." >&2
          exit 1

      - name: Reject no-op invocation
        if: ${{ !inputs.push && inputs.artifact-name == '' }}
        shell: bash
        run: |
          echo "Nothing to do: set push: true, or artifact-name to save a tarball." >&2
          exit 1

      # Resolved before checkout so the ref is validated as hex before it is
      # handed to git, and so the image and SENTRY_RELEASE share one commit.
      - name: Resolve commit SHA
        id: sha
        env:
          FULL_SHA: ${{ inputs.commit-sha != '' && inputs.commit-sha || github.sha }}
        shell: bash
        run: |
          if [[ ! "$FULL_SHA" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "Refusing non-hex commit SHA: $FULL_SHA" >&2
            exit 1
          fi
          echo "full=${FULL_SHA}" >> "$GITHUB_OUTPUT"
          echo "short=${FULL_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.sha.outputs.full }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to container registry
        if: ${{ inputs.push }}
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare artifact directory
        if: ${{ inputs.artifact-name != '' }}
        shell: bash
        run: mkdir -p ./artifact-out

      - name: Write artifact metadata
        if: ${{ inputs.artifact-name != '' && inputs.artifact-metadata != '{}' }}
        env:
          METADATA_JSON: ${{ inputs.artifact-metadata }}
        shell: bash
        run: |
          # Parse metadata into filename\tcontent pairs. Reject any filename
          # that isn't a safe token so a caller can't smuggle in a path
          # traversal or shell metacharacter through this input.
          echo "$METADATA_JSON" | jq -c 'to_entries[]' | while read -r pair; do
            name=$(printf '%s' "$pair" | jq -r '.key')
            value=$(printf '%s' "$pair" | jq -r '.value')
            if [[ ! "$name" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Refusing artifact metadata filename with unsafe characters: $name" >&2
              exit 1
            fi
            printf '%s' "$value" > "./artifact-out/$name"
          done

      - name: Build and push image
        if: ${{ inputs.push }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ inputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SENTRY_RELEASE=${{ steps.sha.outputs.short }}

      - name: Build image to artifact
        if: ${{ !inputs.push && inputs.artifact-name != '' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ inputs.platforms }}
          push: false
          tags: ${{ inputs.tags }}
          outputs: type=docker,dest=./artifact-out/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SENTRY_RELEASE=${{ steps.sha.outputs.short }}

      - name: Upload artifact
        if: ${{ inputs.artifact-name != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ./artifact-out/

  sourcemaps:
    name: Upload frontend source maps
    if: ${{ inputs.upload-sourcemaps }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          missing=""
          [ -n "${{ inputs.glitchtip-org }}" ] || missing="$missing glitchtip-org"
          [ -n "${{ inputs.glitchtip-project }}" ] || missing="$missing glitchtip-project"
          [ -n "${{ secrets.GLITCHTIP_URL }}" ] || missing="$missing GLITCHTIP_URL"
          [ -n "${{ secrets.GLITCHTIP_AUTH_TOKEN }}" ] || missing="$missing GLITCHTIP_AUTH_TOKEN"
          if [ -n "$missing" ]; then
            echo "upload-sourcemaps is true but these are unset:$missing" >&2
            exit 1
          fi

      # Match the image build: same SHA validated as hex, so the source-map
      # release equals the SENTRY_RELEASE baked into the image.
      - name: Resolve commit SHA
        id: sha
        env:
          FULL_SHA: ${{ inputs.commit-sha != '' && inputs.commit-sha || github.sha }}
        shell: bash
        run: |
          if [[ ! "$FULL_SHA" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "Refusing non-hex commit SHA: $FULL_SHA" >&2
            exit 1
          fi
          echo "short=${FULL_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.commit-sha != '' && inputs.commit-sha || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src-frontend
        run: npm ci --no-audit --no-fund

      # Build with source maps (quasar.config.js: build.sourcemap = true)
      - name: Build frontend with source maps
        working-directory: src-frontend
        env:
          SENTRY_RELEASE: ${{ steps.sha.outputs.short }}
        run: npm run build

      # Pinned by SHA256 to defend against supply-chain attack since Gitlab version tags are mutable
      - name: Install glitchtip-cli
        env:
          GLITCHTIP_CLI_VERSION: v1.0.0
          GLITCHTIP_CLI_SHA256: de1c035aa61931a6265d7b29b1614781dfee925466142a907508cb097082dfef
        run: |
          set -euo pipefail
          url="https://gitlab.com/glitchtip/glitchtip-cli/-/jobs/artifacts/${GLITCHTIP_CLI_VERSION}/raw/artifacts/glitchtip-cli-linux-x86_64?job=build-linux-x86_64"
          curl -fsSL "$url" -o glitchtip-cli
          echo "${GLITCHTIP_CLI_SHA256}  glitchtip-cli" | sha256sum -c -
          install -m 0755 glitchtip-cli /usr/local/bin/glitchtip-cli
          rm -f glitchtip-cli
          glitchtip-cli --version

      - name: Inject and upload source maps
        working-directory: src-frontend
        env:
          SENTRY_URL: ${{ secrets.GLITCHTIP_URL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
        run: |
          glitchtip-cli sourcemaps inject ./dist
          glitchtip-cli sourcemaps upload ./dist \
            --release "${{ steps.sha.outputs.short }}" \
            --org "${{ inputs.glitchtip-org }}" \
            --project "${{ inputs.glitchtip-project }}"
