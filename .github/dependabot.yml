# Weekly Dependabot updates for every dependency ecosystem in this repo.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # GitHub Actions used by workflows under .github/workflows/. Dependabot
  # understands SHA-pinned actions and will update both the SHA and the
  # trailing "# vX.Y.Z" version comment.
  - package-ecosystem: "github-actions"
    open-pull-requests-limit: 10
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "18:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major:
        patterns:
          - "*"
        update-types:
          - "major"

  # Docker base image in docker/Dockerfile
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Root package.json (tooling / husky / etc.)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Quasar frontend
  - package-ecosystem: "npm"
    directory: "/src-frontend"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "18:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 5
      semver-patch-days: 3
    groups:
      # Low risk - merge without much review
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Higher risk - review more carefully
      major:
        patterns:
          - "*"
        update-types:
          - "major"

  # Capacitor mobile shell nested inside the frontend
  - package-ecosystem: "npm"
    directory: "/src-frontend/src-capacitor"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Django backend
  - package-ecosystem: "uv"
    directory: "/memberportal"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "18:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 5
      semver-patch-days: 3
    groups:
      # Low risk - merge without much review
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Higher risk - review more carefully
      major:
        patterns:
          - "*"
        update-types:
          - "major"

  # Sphinx docs build
  - package-ecosystem: "pip"
    directory: "/docs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
